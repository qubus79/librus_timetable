# Wszystko (kod i dane) leży w katalogu tego pliku, np. ~/docker/librus_plan.
name: librus_plan

services:
  dzwonek:
    build: .
    image: librus_plan:latest
    container_name: librus_plan
    restart: unless-stopped
    ports:
      # Port na serwerze: domyślnie 8765, zmiana przez LIBRUS_PLAN_PORT w pliku .env
      - "${LIBRUS_PLAN_PORT:-8765}:8000"
    volumes:
      # Dane aplikacji: ~/docker/librus_plan/data
      - ./data:/data:Z   # :Z = etykieta SELinux (Fedora); bez znaczenia na innych systemach
    environment:
      TZ: Europe/Warsaw
      # true tylko wtedy, gdy aplikacja jest dostępna wyłącznie przez HTTPS
      # (Tailscale Serve, Cloudflare Tunnel, reverse proxy z certyfikatem).
      COOKIE_SECURE: "false"
      # Opcjonalnie: własny klucz. Bez tego klucz powstaje w ./data/encryption.key.
      # ENCRYPTION_KEY: ""
